[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-problems-lab"
version = "0.1.0"
description = "Reproducible attack harness and certificate verifiers for open problems in mathematics (Ramsey, kissing/Tammes, unit-distance colouring)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional: quasi-Newton polishing of spherical configurations (L-BFGS-B).
# Every search degrades gracefully without it.
opt = ["scipy>=1.10"]
# Optional: a SAT backend for the Ramsey encoding.  Without it, `oplab sat`
# reports "no-solver" and the SAT tests are skipped; DIMACS export still works.
sat = ["z3-solver>=4.12"]
# Optional, and a different thing: the CDCL engines behind `oplab.multicolour`
# (CaDiCaL, Kissat, Glucose, …).  `sat` is Z3 for the older `oplab sat` path; this is
# the native C++ set the circulant/block campaigns and the `--deep` re-runs drive.
# Without it those re-runs report "no-solver" and the engine tests skip — which is
# how CI stayed green on jobs that were not actually re-running anything.
solvers = ["python-sat>=1.8.dev0"]
# Optional: the batched GPU tabu search (`oplab.gputabu`, scripts/gpu_tabu.py).
# It is a *search* for witnesses, not a solver: without torch every SAT and
# circulant path still decides, and the GPU tests are skipped.
gpu = ["torch>=2.4"]

[project.scripts]
oplab = "oplab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
