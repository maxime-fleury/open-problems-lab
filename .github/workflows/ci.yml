name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      - name: Tests
        run: python -m pytest tests -q
      - name: Re-verify every committed certificate
        run: python -m oplab.cli verify certs
      - name: Smoke-test the SAT encoder on a case with a known answer
        run: |
          python -m oplab.cli sat --n 6 --k 3 --symmetry 3 --seconds 30 --out /tmp/k6.json
          python -m oplab.cli verify /tmp/k6.json

  deep-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      - name: Re-run the exhaustive circulant sweeps from scratch
        run: python -m oplab.cli verify certs/circulant --deep --workers 4

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generated Lean certificates must be up to date
        run: python scripts/gen_lean_certs.py --check
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean layer (re-checks every certificate claim)
        run: cd lean && lake build
