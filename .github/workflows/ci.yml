name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      - name: Tests
        run: python -m pytest tests -q
      - name: The proof stores must match their manifests
        run: |
          python scripts/proof_manifest.py --check
          python scripts/proof_manifest.py --certs certs/cayley --check
      - name: Re-verify every committed certificate
        run: python -m oplab.cli verify certs
      - name: Smoke-test the SAT encoder on a case with a known answer
        run: |
          python -m oplab.cli sat --n 6 --k 3 --symmetry 3 --seconds 30 --out /tmp/k6.json
          python -m oplab.cli verify /tmp/k6.json

  deep-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      - name: Re-run the exhaustive circulant sweeps from scratch
        run: python -m oplab.cli verify certs/circulant --deep --workers 4

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      - name: Replay every stored DRAT trace and re-run those solvers
        run: python -m oplab.cli verify certs/circulant_multicolour --deep --workers 4
      # the group store is the same machinery on a different family: every trace
      # replayed against the encoding of *that* group, then the solver re-run
      - name: Same for the group store (translation-invariant colourings)
        run: python -m oplab.cli verify certs/cayley --deep
      # The cube-and-conquer campaign is a run artifact rather than a certificate,
      # but the claim it makes is committed too: re-reading the two passes, re-running
      # the cover test and re-reading the rows costs seconds and runs no solver, so a
      # row, a cube file or a report that drifted fails here by name instead of being
      # quoted forever.
      - name: The two committed cube-and-conquer passes must still add up
        run: |
          python scripts/cube_conquer.py 97:3,3,3,4 --combine \
            runs/cube_k97_d12.json runs/cube_k97_d12_pass2.json --out cnc.json
          python -c "import json; r = json.load(open('cnc.json')); \
            assert r['verdict'] == 'refuted-cover' and r['counts'] == {'unsat': 4096}, r['verdict']"

  drat-trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opt,sat]"
      # The stored traces are checked by oplab.drat on every run; this job checks
      # them again with an unrelated implementation, so the proofs do not rest on
      # this repository's own checker.  Which commit that is comes from
      # scripts/drat-trim.pin, and the step below hashes the source it compiled
      # against the same file: a checker that changes under us would change what
      # "verified" means, and both the change and its acceptance are a diff here.
      - name: Build drat-trim (pinned commit)
        run: |
          PIN=$(sed -n 's/^commit //p' scripts/drat-trim.pin)
          echo "building drat-trim at $PIN"
          git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          cd /tmp/drat-trim
          git checkout --quiet "$PIN"
          git rev-parse HEAD
          gcc -O2 drat-trim.c -o drat-trim
      - name: Cross-check every stored DRAT trace with the pinned checker
        run: |
          python scripts/drat_trim_check.py --drat-trim /tmp/drat-trim/drat-trim \
            --source /tmp/drat-trim/drat-trim.c --require-pin
      # the tests that need a real checker skip in the test job (it is not on PATH
      # there), so they are run here, against the build the pin just produced
      - name: The cross-check's own tests, against that checker
        env:
          OPLAB_DRAT_TRIM: /tmp/drat-trim/drat-trim
          OPLAB_DRAT_TRIM_SOURCE: /tmp/drat-trim/drat-trim.c
        run: python -m pytest tests/test_drat_trim.py tests/test_proof_store.py -q

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generated Lean certificates must be up to date
        run: python scripts/gen_lean_certs.py --check
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean layer (re-checks every certificate claim)
        run: cd lean && lake build
